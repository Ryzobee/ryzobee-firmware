name: Firmware CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firmware-build:
    # Keep this name stable: main branch protection requires this check.
    name: ESP32-S3 build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile firmware and factory script image
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: firmware/rootmaker
          command: export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) && idf.py build
